; SDK settings — SoftGui / capture_worker must see this via process CWD
; (InitQHYCCDResource uses getcwd()+"qhyccd.ini", NOT the DLL folder alone).
;
; DebugView: debugOutPut=true AND writeLogToFile=false
;   (writeLogToFile=true routes ALL OutputDebugPrintf to ./qhyccdlog/ only —
;    DebugView then shows almost nothing, including QHYCCDGPS lines.)
; File log: set writeLogToFile=true (then use qhyccdlog/, not DebugView).

[image]
name = imageName pat
reverseX=false
reverseY=false
turn_on_ISP=false
Use_Average_Binning=false
anti_exposure_line=true
remove_thermal_noise = false
auto_hard_roi=true

[debug]
debugOutPut = true
writeLogToFile = false
is_test_sdk = false
beep_all = false
force_release = false
use_raw_data = false
auto_ampv = true
use_share_memory = false
skip_chamber_cycle_pump = false

[user_config]
turn_off_ddr_after_conn = false
select_ccd_low_speed = false
anti_black_glow=false
disable_auto_cooler=false
disable_fw_check=false
disable_uvlo_check=false
remove_rbi_setting=false
live_mode_auto_exp=false
qhy600_expose_mode=0

[factory]
f_test_guide=false
f_fast_connect=false
f_disable_message=false
